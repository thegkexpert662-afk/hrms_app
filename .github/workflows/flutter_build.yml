name: Android Build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  android-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter test
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: hrms-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
